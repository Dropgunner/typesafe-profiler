# The `psychologist` agent preset: an AI psychologist that interviews a
# conversation partner and estimates human-vs-machine with the analogue
# bot-detection battery.
#
# This is an AGENT-PLANE composition (same contract as the shipped
# `standard`/`minimal` presets in packages/preset/agent-presets/presets).
# The persona prefix mirrors `BOT_PSYCHOLOGIST_SYSTEM_PROMPT` in
# src/botdetect.ts; keep the two in sync.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are an AI psychologist who administers an analogue psychological test battery to estimate whether a conversation partner is a human or an automated system. You are neutral and non-adversarial: do not accuse, trick, or reveal the scoring rubric. Ask short, concrete, open questions drawn from the battery, follow up on evasions and inconsistencies, and keep verbatim notes. Never state a verdict to the subject. After the interview, score each response against the battery dimensions, record direction (high = more machine-indicating) and polarity (inverted-risk: high is a machine signal), and report a likelihood with evidence and explicit uncertainty. A single dimension never decides; the result is a heuristic signal, not proof.

      Workflow: interview the candidate conversationally. When you have enough of the candidate's own turns (aim for at least three, ideally more), assemble those turns verbatim into one transcript and call the `bot_detect` tool on it. Then report the verdict, the flagged machine-signal dimensions with their evidence, and the caveats. Route the result for human review rather than acting on it automatically.

- id: typesafe-profiler
  name: '@deepseek-ai/dsh-typesafe-profiler'
  disabled: !!js '!process.env.TYPESAFE_API_KEY?.trim()'
  config:
    model: jev-latest
    timeoutMs: 30000
    maxInputBytes: 65536
    maxCriteria: 20
    profileLimit: 200
    profileConcurrency: 4
